
name: Build WoT Radio Voice VST3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target WoTRadioVoice_VST3

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: WoT-Radio-Voice-VST3-Windows-x64
          path: build/WoTRadioVoice_artefacts/Release/VST3/
